name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build + Tests + Checkstyle
        run: mvn -B clean verify

      - uses: actions/upload-artifact@v4
        with:
          name: KaribouWelcome
          path: target/*.jar