name: Build Minecraft Plugin

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    container:
      image: maven:3.9-eclipse-temurin-25

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        env:
          INTERNAL_GIT_URL: ${{ vars.INTERNAL_GIT_URL }}
          GIT_LOCAL_TOKEN: ${{ secrets.GIT_LOCAL_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -e
          if [ -z "$INTERNAL_GIT_URL" ]; then
            echo "ERROR: INTERNAL_GIT_URL not defined"
            exit 1
          fi
          if [ -z "$GIT_LOCAL_TOKEN" ]; then
            echo "ERROR: GIT_LOCAL_TOKEN not defined"
            exit 1
          fi
          git -c http.extraHeader="Authorization: token $GIT_LOCAL_TOKEN" \
            clone \
            "$INTERNAL_GIT_URL/$REPOSITORY.git" \
            .

      # ============================================================
      # VERSION
      # ============================================================
      - name: Get version
        id: version
        run: |
          VERSION=$(mvn -q help:evaluate \
            -Dexpression=project.version \
            -DforceStdout)
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ============================================================
      # CHECK IF TAG EXISTES
      # ============================================================
      - name: Check if tag exists
        id: check
        run: |
          TAG="v$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"

          if git tag -l "$TAG" | grep -q .; then
            echo "Tag $TAG already exists, no build needed."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG missing, new version detected"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      # ============================================================
      # BUILD AND PACKAGE
      # ============================================================
      - name: Install jq
        run: apt-get update && apt-get install -y jq

      - name: Build jar
        if: steps.check.outputs.should_release == 'true'
        run: mvn -B clean package

      # ============================================================
      # CREATE TAG
      # ============================================================
      - name: Create tag
        if: steps.check.outputs.should_release == 'true'
        env:
          INTERNAL_GIT_URL: ${{ vars.INTERNAL_GIT_URL }}
          GIT_LOCAL_TOKEN: ${{ secrets.GIT_LOCAL_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          TAG="v$VERSION"
          GIT_URL="$INTERNAL_GIT_URL/$REPOSITORY.git"

          git config user.email "ci@karibou.dev"
          git config user.name "Gitea CI"

          if git tag -l "$TAG" | grep -q .; then
            echo "Tag $TAG already exists locally, skipping creation"
          else
            git tag -a "$TAG" -m "Release $TAG"
          fi

          echo "Push the $TAG tag to Gitea..."
          git -c http.extraHeader="Authorization: token $GIT_LOCAL_TOKEN" \
            push "$GIT_URL" "$TAG"
          echo "Tag $TAG pushed"

      # ============================================================
      # VERIFY REMOTE TAG
      # ============================================================
      - name: Verify Gitea tag
        if: steps.check.outputs.should_release == 'true'
        env:
          INTERNAL_GIT_URL: ${{ vars.INTERNAL_GIT_URL }}
          GIT_LOCAL_TOKEN: ${{ secrets.GIT_LOCAL_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          TAG="v$VERSION"
          GIT_URL="$INTERNAL_GIT_URL/$REPOSITORY.git"

          if git -c http.extraHeader="Authorization: token $GIT_LOCAL_TOKEN" \
            ls-remote --exit-code --tags \
            "$GIT_URL" \
            "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG available on Gitea"
          else
            echo "Tag $TAG missing from Gitea"
            exit 1
          fi

      # ============================================================
      # GENERATE CHANGELOG
      # ============================================================
      - name: Install git-cliff
        if: steps.check.outputs.should_release == 'true'
        run: |
          # Detect architecture and download matching binary
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64)  ASSET_PATTERN="x86_64-unknown-linux-gnu.tar.gz" ;;
            aarch64) ASSET_PATTERN="aarch64-unknown-linux-gnu.tar.gz" ;;
            *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
          esac
          echo "Architecture: $ARCH -> $ASSET_PATTERN"

          DOWNLOAD_URL=$(curl -sS "https://api.github.com/repos/orhun/git-cliff/releases/latest" \
            | jq -r --arg pat "$ASSET_PATTERN" '.assets[] | select(.name | endswith($pat)) | .browser_download_url')
          echo "Downloading: $DOWNLOAD_URL"
          curl -sSfL "$DOWNLOAD_URL" \
            | tar xz --wildcards -C /usr/local/bin --strip-components=1 '*/git-cliff'
          git-cliff --version

      - name: Generate changelog
        if: steps.check.outputs.should_release == 'true'
        run: |
          TAG="v$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          git-cliff --tag "$TAG" -o CHANGELOG.md
          echo "=== CHANGELOG ==="
          cat CHANGELOG.md

      # ============================================================
      # CREATE GITEA RELEASE
      # ============================================================
      - name: Create Gitea release
        if: steps.check.outputs.should_release == 'true'
        env:
          INTERNAL_GIT_URL: ${{ vars.INTERNAL_GIT_URL }}
          GIT_LOCAL_TOKEN: ${{ secrets.GIT_LOCAL_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          TAG="v$VERSION"

          GIT_URL="$INTERNAL_GIT_URL/$REPOSITORY.git"

          # Build and validate the JSON payload with jq.
          # --rawfile safely escapes newlines and control characters.
          jq -n \
            --arg tag "$TAG" \
            --arg name "KaribouWelcome $TAG" \
            --rawfile body CHANGELOG.md \
            '{tag_name: $tag, name: $name, body: $body}' \
            > /tmp/release-payload.json
          jq empty /tmp/release-payload.json

          HTTP_STATUS=$(curl -sS -o /tmp/release-response.json -w "%{http_code}" -X POST \
            "$INTERNAL_GIT_URL/api/v1/repos/$REPOSITORY/releases" \
            -H "Authorization: token $GIT_LOCAL_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/release-payload.json)

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "ERROR: Unable to create the release (HTTP $HTTP_STATUS)"
            sed 's/[^[:print:]\t]//g' /tmp/release-response.json || true
            exit 1
          fi

          RELEASE_ID=$(sed -n 's/.*"id"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' /tmp/release-response.json | head -n 1)

          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: Gitea response does not contain a release ID"
            sed 's/[^[:print:]\t]//g' /tmp/release-response.json || true
            exit 1
          fi

          # Use the upload URL returned by Gitea when available.
          UPLOAD_URL=$(grep -o '"upload_url"[[:space:]]*:[[:space:]]*"[^"]*"' /tmp/release-response.json \
            | sed 's/.*"upload_url"[[:space:]]*:[[:space:]]*"//; s/"$//' \
            | sed 's/{?name}/?name=/; s/{name}/?name=/')
          if [ -z "$UPLOAD_URL" ]; then
            UPLOAD_URL="$INTERNAL_GIT_URL/api/v1/repos/$REPOSITORY/releases/$RELEASE_ID/assets?name="
          fi
          echo "Upload endpoint: $UPLOAD_URL"

          echo "Release created : $TAG"
          for JAR in target/*.jar; do
            JAR_NAME=$(basename "$JAR")
            echo "Upload : $JAR_NAME"

            case "$UPLOAD_URL" in
              *"?name="*) ASSET_URL="${UPLOAD_URL}${JAR_NAME}" ;;
              *) ASSET_URL="${UPLOAD_URL}?name=${JAR_NAME}" ;;
            esac

            HTTP_STATUS=$(curl -sS -o /tmp/upload-response.json -w "%{http_code}" -X POST \
              "$ASSET_URL" \
              -H "Authorization: token $GIT_LOCAL_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$JAR")

            if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
              echo "Failed to upload $JAR_NAME (HTTP $HTTP_STATUS)"
              sed 's/[^[:print:]\t]//g' /tmp/upload-response.json || true
              exit 1
            fi

            echo "Uploaded : $JAR_NAME"
          done

          # Commit the generated changelog only when it actually changed.
          # This commit may trigger another workflow run; that run exits
          # at the tag check because the release tag already exists.
          git config user.email "ci@karibou.dev"
          git config user.name "Gitea CI"
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update changelog for $TAG"
            git -c http.extraHeader="Authorization: token $GIT_LOCAL_TOKEN" \
              push "$GIT_URL" main
          else
            echo "CHANGELOG.md unchanged; no commit needed"
          fi

      # ============================================================
      # MIRROR TO GITHUB IF PUBLIC
      # ============================================================
      - name: Push to GitHub if public
        if: steps.check.outputs.should_release == 'true'
        env:
          INTERNAL_GIT_URL: ${{ vars.INTERNAL_GIT_URL }}
          GIT_LOCAL_TOKEN: ${{ secrets.GIT_LOCAL_TOKEN }}
          GIT_REMOTE_TOKEN: ${{ secrets.GIT_REMOTE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          TAG="v$VERSION"

          RESPONSE=$(curl -sS \
            -H "Authorization: token $GIT_LOCAL_TOKEN" \
            "$INTERNAL_GIT_URL/api/v1/repos/$REPOSITORY")

          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
          PRIVATE=$(echo "$RESPONSE" | jq -r '.private')

          if [ "$PRIVATE" = "false" ]; then
            echo "Public repository: GitHub synchronization"

            if [ -z "$GIT_REMOTE_TOKEN" ]; then
              echo "GIT_REMOTE_TOKEN is missing"
              exit 1
            fi

            REPO_NAME="${REPOSITORY#*/}"
            GITHUB_REPO="https://x-access-token:${GIT_REMOTE_TOKEN}@github.com/KaribouDev/$REPO_NAME.git"

            git remote remove github 2>/dev/null || true
            git remote add github "$GITHUB_REPO"

            # Gitea is the source of truth; GitHub is a mirror.
            # Force synchronization to avoid stale-info rejections.
            git push github main --force
            git push github --tags --force

            GH_RELEASE_RESPONSE=$(curl -sS -X POST \
              "https://api.github.com/repos/KaribouDev/$REPO_NAME/releases" \
              -H "Authorization: Bearer $GIT_REMOTE_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"KaribouWelcome $TAG\"}")

              GH_RELEASE_ID=$(echo "$GH_RELEASE_RESPONSE" \
                | jq -r '.id')

            if [ -z "$GH_RELEASE_ID" ]; then
              echo "ERROR: unable to create the GitHub release"
              echo "$GH_RELEASE_RESPONSE"
              exit 1
            fi

            for JAR in target/*.jar; do
              JAR_NAME=$(basename "$JAR")
              curl -sS -f -X POST \
                "https://uploads.github.com/repos/KaribouDev/$REPO_NAME/releases/$GH_RELEASE_ID/assets?name=$JAR_NAME" \
                -H "Authorization: Bearer $GIT_REMOTE_TOKEN" \
                -H "Content-Type: application/java-archive" \
                --data-binary "@$JAR"
            done

            echo "GitHub synchronization complete"
          else
            echo "Private repository: no GitHub synchronization"
          fi
