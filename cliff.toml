# ============================================================
# git-cliff configuration for KaribouWelcome
# https://git-cliff.org/docs/configuration
# ============================================================

[changelog]
# Header rendered before the changelog body
header = """
# Changelog\n
All notable changes to KaribouWelcome will be documented in this file.\n
"""

# Body template for each release
body = """
{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## Unreleased
{% endif %}\
{% if previous %}
{% if previous.commit_id and commit_id %}
[{{ previous.commit_id | truncate(length=7, end="") }}]({{ previous.commit_id }})...\
[{{ commit_id | truncate(length=7, end="") }}]({{ commit_id }})
{% endif %}\
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}]({{ commit.id }}))
{% endfor %}
{% endfor %}\n
"""

# Footer rendered at the end
footer = """
---
*Generated by [git-cliff](https://git-cliff.org/)*
"""

# Trim whitespace from the template output
trim = true

[git]
# Parse conventional commits
conventional_commits = true

# Keep non-conventional commits (they go to "Other")
filter_unconventional = false

# Map commit messages to groups
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^doc", group = "Documentation" },
    { message = "^style", group = "Style" },
    { message = "^test", group = "Tests" },
    { message = "^build", group = "Build" },
    { message = "^ci", group = "CI" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "Chores" },
    { message = "^revert", group = "Reverts" },
]

# Don't filter out non-matching commits
filter_commits = false

# Order commits oldest first within each group
sort_commits = "oldest"
