# ============================================================
# git-cliff configuration for KaribouWelcome
# https://git-cliff.org/
# ============================================================

[changelog]
# Header template rendered before the changelog body
header = """
# Changelog\n
All notable changes to KaribouWelcome will be documented in this file.\n
"""

# Template for each commit group
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group in commits %}
    ### {{ group.group | striptags | trim | upper_first }}
    {% for commit in group.commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {{ commit.message | upper_first | trim }}\
            {% if commit.links %} ({% for link in commit.links %}\
                [{{ link.text }}]({{ link.href }})\
            {% endfor %}){% endif %}\
    {% endfor %}
{% endfor %}\n
"""

# Remove the leading and trailing whitespace from the template
trim = true

# Template for the changelog footer
footer = """
---
*Generated by [git-cliff](https://git-cliff.org/)*
"""

# Process commits in reverse order (newest first)
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^doc", group = "Documentation" },
    { message = "^style", group = "Style" },
    { message = "^test", group = "Tests" },
    { message = "^build", group = "Build" },
    { message = "^ci", group = "CI" },
    { message = "^chore", group = "Chores" },
    { message = "^revert", group = "Reverts" },
    { message = ".*", group = "Other" },
]

# Protect breaking changes from being removed by commit_parsers
protect_breaking_changes = false

[git]
# Parse the commits based on conventional commits convention
conventional_commits = true

# Detect breaking changes from commit body (BREAKING CHANGE: ...)
detect_breaking_changes = true

# Exclude specific commits from changelog
exclude_commits = [
    { message = "^chore\\(release\\)", author = "Gitea CI" },
]

# Exclude specific authors from changelog
exclude_authors = []

# Count the number of commits per group
count_tags = true
