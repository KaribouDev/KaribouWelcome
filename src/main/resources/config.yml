# ============================================================
# KaribouWelcome Configuration
# ============================================================
#
# Formatting uses MiniMessage:
# https://docs.advntr.dev/minimessage/format.html
#
# Variables:
#   %player% -> Player name
#
# Examples:
#
# <green>Hello
# <gold><bold>Important
# <red>Error
# <gradient:#ff0000:#ffff00>Gradient
# <rainbow>Rainbow text
#
# ============================================================

public:
  # Message shown to everyone when a player joins
  login: "<green>%player% joined the server.</green>"

  # Message shown to everyone when a player joins for the first time
  new-player: "<gold><bold>%player%</bold> joined the server for the first time!</gold>"

  # Message shown to everyone when a player leaves
  quit: "<yellow>%player% left the server.</yellow>"

private:
  # Sent only to new players
  welcome:
    - "<gold>Welcome to the server, <yellow>%player%</yellow></gold>!"
    - "<gray>We hope you enjoy your stay."
    - "<gray>Use <yellow>/rules</yellow> to read the rules again."

  # Rules displayed with /rules
  rules:
    - "<gold>========== Rules =========="
    - "<white>1. Respect other players."
    - "<white>2. No cheating."
    - "<white>3. No griefing."
    - "<white>4. Have fun!"
    - "<gold>==========================="

# ============================================================
# System messages (used by commands)
# ============================================================
errors:
  # Message sent when a player lacks permission
  no-permission: "<red>You don't have permission.</red>"

  # Message sent when a command is executed from console but requires a player
  player-only: "<red>This command must be executed by a player.</red>"

  # Message sent after a successful config reload
  config-reloaded: "<green>Configuration reloaded.</green>"
